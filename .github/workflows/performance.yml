name: Performance Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment
        if: github.event_name == 'pull_request'
        uses: fountainhead/action-wait-for-check@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: deploy-staging
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://stellarlend-staging.vercel.app
            https://stellarlend-staging.vercel.app/lending
            https://stellarlend-staging.vercel.app/dashboard
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📊 Performance Report\n\n';
            comment += '✅ Lighthouse CI completed successfully!\n';
            comment += '📦 Bundle size analysis completed!\n\n';
            comment += 'Check the full report in the Actions tab.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  bundle-size:
    name: Bundle Size Budgets
    runs-on: ubuntu-latest
    # Runs on every push/PR so regressions are caught before merge.
    # bundlewatch exits non-zero when any file exceeds its maxSize,
    # which causes this job — and therefore the PR check — to fail.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Check bundle size budgets (fails on regression)
        # bundlewatch exits 1 when any chunk exceeds its maxSize budget.
        # Budgets are defined in bundlewatch.config.json and include:
        #   - lending route:   150 KB
        #   - dashboard route: 200 KB  ← added for issue #539
        #   - shared chunks:   500 KB
        #   - pages chunks:    250 KB
        #   - CSS:              50 KB
        run: npx bundlewatch --config bundlewatch.config.json