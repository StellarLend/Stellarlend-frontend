name: Performance Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The "Wait for deployment" + "Run Lighthouse CI" steps that used to
      # live here targeted https://stellarlend-staging.vercel.app, a Vercel
      # staging deployment this repo has no working deploy pipeline/secrets
      # for. That URL 404s, which reliably failed Lighthouse's navigation
      # and took this whole job down before it ever got to the self-
      # contained bundle-size check below. Disabled until a real staging
      # deployment (and the checkName it waits on) exists in CI.
      - name: Bundle size analysis
        run: |
          npm ci
          npm run build
          npx bundlewatch --config bundlewatch.config.json

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📊 Performance Report\n\n';
            comment += '📦 Bundle size analysis completed!\n\n';
            comment += 'Check the full report in the Actions tab.\n\n';
            comment += '_Lighthouse CI is currently disabled: it targets a staging deployment (stellarlend-staging.vercel.app) this repo does not have a working deploy pipeline for._';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });